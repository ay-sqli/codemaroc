    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const markdownContent = "# ℹ️ علامات الإرشاد (Indications)\n\n## 🅿️ 1. الوقوف والتوقف (Stationnement)\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445144.png\"> **موقف سيارات**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445158.png\"> **مكان مهيأ للتوقف المؤدى عنه**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445172.png\"> **مكان مهيأ للتوقف المجاني ولمدة زمنية محددة مع مراقبة بواسطة قرص**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445186.png\"> **موقف سيارات خاص بشحن السيارات الكهربائية**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445201.png\"> **مكان مهيأ لشحن السيارات الكهربائية**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445215.png\"> **موقف سيارات يمكن عنده لمستعملي الطريق ركوب حافلة**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445232.png\"> **موقف سيارات يمكن عنده لمستعملي الطريق ركوب الترامواي**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445252.png\"> **موقف سيارات يمكن عنده لمستعملي الطريق ركوب قطار**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1687172780520.png\"> **محطة سيارة الأجرة: الوقوف والتوقف مخصص فقط لسيارات الأجرة**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445722.png\"> **مكان معد لتوقف القوافل والقوافل ذات محرك**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445945.png\"> **مكان الوقوف الاستعجالي**\n\n## 🛣️ 2. المسالك وظروف السير (Voies et circulation)\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445323.png\"> **طريق ذات اتجاه واحد**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445774.png\"> **لكم حق الأولوية بالنسبة لحركة السير القادمة من الإتجاه المعاكس**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445379.png\"> **ظروف سير خاصة بمسلك على الطريق المتبعة**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445393.png\"> **تشوير مسبق لمسلك خاص بالتجاوز أو لمقطع طريق بقارعات منفصلة**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445364.png\"> **ظروف سير خاصة بمسلك على الطريق المتبعة**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445350.png\"> **ظروف سير خاصة بمسلك على الطريق المتبعة**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445471.png\"> **ظروف خاصة للسير على الطريق أو طريق متفرع**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445407.png\"> **مسار تجاوز ذو ثلاثة مسالك**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445421.png\"> **بداية مقطع طريق ذو ثلاثة مسالك**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445337.png\"> **نهاية مسلك التجاوز على طريق ذات ثلاثة مسالك**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445787.png\"> **نقص عدد المسالك في طريق ذات قارعات منفصلة أو في مسلك للتجاوز**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445801.png\"> **نقص عدد المسالك في طريق ذات قارعات منفصلة أو في مسلك للتجاوز**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445815.png\"> **نقص عدد المسالك في طريق ذات قارعات منفصلة أو في مسلك للتجاوز**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445439.png\"> **مسالك مخصصة عند الاقتراب من ملتقى الطرق من أجل الانعطاف نحو اليسار**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445455.png\"> **مسالك مخصصة عند الاقتراب من ملتقى الطرق من أجل الانعطاف نحو اليمين**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445519.png\"> **مسلك غير نافذ**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445534.png\"> **تشوير مسبق لمسلك غير نافذ**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445554.png\"> **ارشاد الى وجود مخفض السرعة المحدودب**\n\n## 🚶 3. الراجلون والدراجات والترامواي (Piétons, cycles, tram)\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1687172905740.png\"> **ممر الراجلين**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445740.png\"> **منطقة خاصة بالراجلين**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445759.png\"> **نهاية المنطقة الخاصة بالراجلين**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445870.png\"> **ممر خاص بسير الراجلين والمركبات بدون محرك**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445884.png\"> **نهاية الممر الخاص بالراجلين والمركبات بدون محرك**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445570.png\"> **إعلان عن وجود مسلك أو شريط خاص بالدراجات منصوح به**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445584.png\"> **إعلان عن نهاية مسلك أو شريط خاص بالدراجات المنصوح به**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445709.png\"> **مرور الترامواي**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445898.png\"> **وقوف الحافلات**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445925.png\"> **وقوف الترامواي**\n\n## 🛣️ 4. الطريق السيار والأداء (Autoroute et péage)\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1689851623956.png\"> **مدخل الطريق السيار: بداية تطبيق قواعد السير الخاصة بالطريق السيار**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1689851636189.png\"> **نهاية الطريق السيار: نهاية تطبيق قواعد السير الخاصة بالطريق السيار**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445626.png\"> **تشوير مسبق لمكان سحب تذكرة الأداء**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445639.png\"> **أداء عند عون التحصيل**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1687173699364.png\"> **أداء بالبطاقة البنكية**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1687173211473.png\"> **أداء بواسطة بطاقة الاشتراك**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445680.png\"> **أداء عن بعد بواسطة الاشتراك**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1687173230285.png\"> **أداء آلي نقدا**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079446437.png\"> **التشوير المسبق بوجود محطة الأداء**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079446480.png\"> **التشوير المسبق لمحطة الأداء**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079446452.png\"> **التشوير المسبق لبداية مقطع طرقي أو طريق سيار بالأداء**\n\n## 🚇 5. الأنفاق ومنافذ الإغاثة (Tunnels et issues de secours)\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445829.png\"> **الدخول إلى النفق: يمنع نصف الدورة والوقوف والتوقف + إجبارية أضواء التقابل**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445842.png\"> **الخروج من النفق**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1689674764361.png\"> **مسلك الإغاثة على اليمين**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1687172938810.png\"> **مسلك الإغاثة على اليسار**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079446418.png\"> **منفذ الإغاثة على اليمين**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079446403.png\"> **منفذ الإغاثة على اليسار**\n\n## 📡 6. المراقبة والسلامة (Contrôle et sécurité)\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079446538.png\"> **منطقة تكون السرعة فيها مراقبة بجهاز أو عدة أجهزة رادار**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079446552.png\"> **مراقبة السرعة المتوسطة بحساب الوقت المستغرق عند الخروج من الطريق السيار**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079446523.png\"> **منطقة تكون الحمولة فيها مراقبة في محطة ثابتة للقياس**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079446466.png\"> **علامة تذكر بالمسافة القانونية الواجب تركها بين المركبات**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079446566.png\"> **علامة تذكر بالمسافة القانونية الواجب تركها بين المركبات**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079446494.png\"> **علامة تذكر بالمسافة القانونية الواجب تركها بين المركبات**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079446509.png\"> **لوحة للتذكير بمعلومات عامة حول السلامة الطرقية**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1687172732415.png\"> **خطر نشوب حريق بالغابة**\n\n## 🏨 7. المرافق والخدمات (Services)\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445268.png\"> **مؤسسة طبية**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445979.png\"> **مركز الإغاثة**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079446036.png\"> **مركز نداء الإغاثة**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445994.png\"> **مركز هاتف**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079446008.png\"> **محطة إصلاحات أولية**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079446022.png\"> **محطة توزيع الوقود مفتوحة 7 أيام / 7 و24 ساعة / 24**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079446356.png\"> **محطة نفخ العجلات ذات استعمال مجاني**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079446370.png\"> **عدة لمكافحة الحريق**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445960.png\"> **مرافق أو خدمات متنوعة**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079446050.png\"> **مطعم**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079446064.png\"> **فندق**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079446092.png\"> **محل بيع مشروبات أو مقهى**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079446166.png\"> **مأوى فندقي**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079446182.png\"> **مأوى للشباب**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079446244.png\"> **مراحيض عمومية**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079446230.png\"> **منشآت يمكن ولوجها من طرف الأشخاص ذوي الحركية المحدودة**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079446272.png\"> **محطة لتفريغ المياه المستعملة خاصة بالقوافل**\n\n## 🏕️ 8. السياحة والترفيه (Tourisme et loisirs)\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079446384.png\"> **منظر جميل**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079446078.png\"> **مكان للتنزه**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079446106.png\"> **مخيم**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079446134.png\"> **ساحة معدة للتخييم ووقوف مركبات التخييم**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079446149.png\"> **ساحة معدة لوقوف قوافل التخييم**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079446120.png\"> **نقطة انطلاق جولة**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079446197.png\"> **نقطة انطلاق مسار للتزلج**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079446215.png\"> **معلومات متعلقة بخدمات أو أنشطة سياحية**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079446258.png\"> **محطة نقل هوائي**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079446300.png\"> **مكان انطلاق نقل هوائي**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079446286.png\"> **رصيف إركاب على متن السفن**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079446328.png\"> **مكان وضع القوارب الخفيفة في الماء**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079446314.png\"> **ألعاب الأطفال**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079446342.png\"> **مكان للترفيه**\n- <img src=\"../../inputs/01_la_route/05_indications/المحور الفرعي_files/1682079445856.png\"> **إرشادات مختلفة**\n\n## 💡 نصائح المدرب (Astuces du moniteur)\n- مربع أو مستطيل أزرق = إرشاد (Carré bleu = indication)\n- علامة الإرشاد لا تمنع ولا تجبر ← تعطي معلومة فقط\n- طريق ذات اتجاه واحد (مربع أزرق) ≠ اتجاه إجباري (دائرة زرقاء)\n- «لكم حق الأولوية» (سهم أبيض كبير) ← عكسها علامة «أفسح المجال للقادم من الاتجاه المعاكس» (دائرة حمراء)\n\n## ⚠️ فخاخ الامتحان (Pièges d'examen)\n- داخل النفق: ممنوع نصف الدورة والوقوف والتوقف + أضواء التقابل إجبارية\n- مسلك غير نافذ ← الطريق مسدودة، لا تدخلها إلا للوصول\n- محطة سيارة الأجرة ← ممنوع على السيارات الخاصة الوقوف والتوقف فيها\n- «مدخل الطريق السيار» ← تبدأ قواعد الطريق السيار (سرعة دنيا، منع الراجلين...)\n";
            const { Transformer, Markmap } = window.markmap;
            const transformer = new Transformer();
            const { root } = transformer.transform(markdownContent);
            const mm = Markmap.create('#mindmap', { embedAssets: true, duration: 300, maxWidth: 0, initialExpandLevel: 3 }, root);
            window.__mm = mm;
            setTimeout(() => { if (mm && mm.fit) mm.fit(); }, 300);
            document.querySelectorAll('#mindmap img').forEach(img => {
                img.addEventListener('load', () => { if (mm && mm.fit) mm.fit(); });
            });
        });
    </script>
